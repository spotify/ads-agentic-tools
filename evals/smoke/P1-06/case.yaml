schema_version: "1.1"
name: P1-06
description: "Smoke case P1-06. Should act: lists pacing, platform, and delivery format with display names, without asking."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    What are the settings on Gym Hour?
context:
  scaffold_script: scaffold.sh
graders:
  - name: display-In-stream
    type: regex
    pattern: '\bIn-stream\b'
    flags: i
  - name: display-Standard
    type: regex
    pattern: '\bStandard\b'
  - name: display-iOS
    type: regex
    pattern: '\biOS\b'
  - name: enum-IN_STREAM-absent
    type: regex
    weight: 2
    pattern: 'IN_STREAM'
    match: not_contains
  - name: enum-IOS-absent
    type: regex
    weight: 2
    pattern: '\bIOS\b'
    match: not_contains
  - name: enum-PACING_EVEN-absent
    type: regex
    weight: 2
    pattern: 'PACING_EVEN'
    match: not_contains
