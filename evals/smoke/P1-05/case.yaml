schema_version: "1.1"
name: P1-05
description: "Smoke case P1-05. Copies as draft and names the copy. No confirmation (drafts are reversible)."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Make a draft copy of Indie Spotlight.
context:
  scaffold_script: scaffold.sh
graders:
  - name: copy-created
    type: regex
    pattern: '^POST__ad_accounts__\{ad_account_id\}__drafts__campaigns '
    target: { source: file, path: .claude/.api-requests.log }
    flags: m
    weight: 3
  - name: copy-named
    type: regex
    pattern: 'Indie Spotlight'
  - name: uses-copy-not-clone
    type: regex
    pattern: '\b(clon\w*)\b'
    flags: i
    match: not_contains
