schema_version: "1.1"
name: P3-05
description: "Smoke case P3-05. Asks which, likeliest first. Doesn't submit."
tags: [smoke, P3, high_stakes_ask, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Submit the holiday campaign.
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-both
    type: regex
    pattern: '^(?=[\s\S]*Holiday Audio)(?=[\s\S]*Holiday Video)'
  - name: uses-submit-not-publish
    type: regex
    pattern: '\b(publish\w*)\b'
    flags: i
    match: not_contains
