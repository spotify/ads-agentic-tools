schema_version: "1.1"
name: P1-04
description: "Smoke case P1-04. States status as Pending approval. No raw enum. Real campaigns report this in derived_status (status stays ACTIVE), so the plain status alone would wrongly say it's live."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Is Podcast Launch live yet?
context:
  scaffold_script: scaffold.sh
graders:
  - name: display-Pending-approval
    type: regex
    pattern: 'pending approval'
    flags: i
  - name: enum-PENDING_APPROVAL-absent
    type: regex
    pattern: '\bPENDING_APPROVAL\b'
    match: not_contains
    weight: 2
  - name: not-called-live
    type: regex
    pattern: '\b(is|it.s) (live|active|running)\b'
    flags: i
    match: not_contains
    weight: 2
