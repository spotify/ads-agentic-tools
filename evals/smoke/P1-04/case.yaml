schema_version: "1.1"
name: P1-04
description: "Smoke case P1-04. Says the campaign isn't live yet because its ad set and ad are pending approval. No raw enum. The campaign itself is ACTIVE, so the campaign status alone would wrongly say it's live."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Is Podcast Launch live yet?
context:
  scaffold_script: scaffold.sh
graders:
  - name: display-Pending-approval
    type: regex
    pattern: 'pending approval'
    flags: i
  - name: not-called-live
    type: llm
    weight: 2
    criteria: |
      PASS if the final reply makes clear Podcast Launch isn't live or delivering yet because its ad set or ad is still pending approval. Saying the campaign itself is active is fine as long as the reply makes that clear.
      FAIL if it says or implies the campaign is live or delivering, or doesn't mention the pending approval.
