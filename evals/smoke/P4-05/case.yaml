schema_version: "1.1"
name: P4-05
description: "Smoke case P4-05. Turn 1 (history) proposed staging Summer Tour's daily budget change from USD 1,200.00 to USD 1,800.00 in a draft, and the user agreed. Should stage it once without asking again, report the new budget, and ask before publishing."
tags: [smoke, P4, confirm_followup, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    /spotify-ads-api:drafts Yes, go.
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
graders:
  - name: budget-change-sent
    weight: 3
    type: regex
    target: { source: file, path: .claude/.api-requests.log }
    pattern: '^PATCH__\S*ad_sets\S* .*1800000000'
    flags: m
  - name: no-raw-values
    type: regex
    pattern: '\b[A-Z]{2,}(?:_[A-Z0-9]+)+\b|\b1800000000\b'
    match: not_contains
  - name: reports-new-budget
    type: regex
    pattern: 'USD 1,800\.00'
