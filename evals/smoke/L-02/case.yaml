schema_version: "1.1"
name: L-02
description: "Language case L-02. Turn 1 (history) asked to confirm pausing Summer Tour - Weekend. After a yes, the pause fails with a no-edit-access error. Reply says the pause was denied and the ad set is still delivering, names no role, and shows no raw code or HTTP status."
tags: [smoke, language, error, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    /spotify-ads-api:bulk Yes, pause it on the live ad set.
context:
  # Uses the default settings (auto_execute true). With the confirm settings, the
  # bulk skill would ask again and the yes would never reach the pause.
  scaffold_script: scaffold.sh
  history_file: history.jsonl
graders:
  - name: names-ad-set
    type: regex
    pattern: 'Summer Tour - Weekend'
  - name: states-denial
    type: regex
    weight: 2
    pattern: "edit access|can'?t (edit|change|pause)|cannot (edit|change|pause)|not allowed|denied|permission|don't have access|do not have access"
    flags: i
  # The ads, bulk, campaigns, and drafts skills say a denied direct write names no
  # role, matching scenario-34.
  - name: no-role-referral
    type: regex
    pattern: '\badmin\b|\bpermission from\b'
    flags: i
    match: not_contains
  - name: no-raw-error
    type: regex
    weight: 2
    pattern: 'HTTP|status (code )?\d{3}|\b403 (error|response)|ERR-\d+'
    match: not_contains
  - name: no-pause-claimed
    type: regex
    pattern: '\b(is|was|now|been) paused\b|\bpaused it\b|ad set paused'
    flags: i
    match: not_contains
  - name: cause-then-fix
    type: llm
    criteria: |
      Pausing the ad set failed because the user doesn't have edit access.
      PASS if the reply says the ad set wasn't paused because pausing it directly was denied, and that it's still delivering. It may stop there: a pause can't be saved as a draft, so there's no draft to offer. No blame, no guessing at other causes.
      FAIL if it claims the ad set was paused, tells the user to ask an admin or names any role, says the credentials are read-only, blames the user, guesses at causes the error didn't give, offers to save the pause as a draft, or shows a raw error code or HTTP status.
