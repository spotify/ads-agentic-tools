schema_version: "1.1"
name: P1-03
description: "Smoke case P1-03. Total spend for the current month with currency code. Doesn't ask how to break it down."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    How much did we spend this month?
context:
  scaffold_script: scaffold.sh
graders:
  - name: currency-code
    type: regex
    pattern: '\bUSD \d'
  - name: default-breakdown-chosen
    type: llm
    criteria: |
      PASS if the final reply gives the total spend for the current month with a currency code, choosing a sensible default breakdown (or none) without asking.
      FAIL if it asks how to break the spend down, or asks any question before answering.
