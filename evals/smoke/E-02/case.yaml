schema_version: "1.1"
name: E-02
description: "Smoke case E-02. women and non-binary people; LiveRamp."
tags: [smoke, enum_display, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Who does Book Club target?
context:
  scaffold_script: scaffold.sh
graders:
  - name: display-LiveRamp
    type: regex
    pattern: 'LiveRamp'
  - name: display-non-binary-people
    type: regex
    pattern: 'non-binary people'
    flags: i
  - name: display-women
    type: regex
    pattern: 'women'
    flags: i
  - name: enum-FEMALE-absent
    type: regex
    pattern: '\bFEMALE\b'
    match: not_contains
    weight: 2
  - name: enum-LIVERAMP-absent
    type: regex
    pattern: '\bLIVERAMP\b'
    match: not_contains
    weight: 2
  - name: enum-NON_BINARY-absent
    type: regex
    pattern: '\bNON_BINARY\b'
    match: not_contains
    weight: 2
