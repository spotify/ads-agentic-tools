schema_version: "1.1"
name: P1-01
description: "Smoke case P1-01. Returns CTR with a date range. No question, no confirmation."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    What's the CTR on Late Night Jazz?
context:
  scaffold_script: scaffold.sh
graders:
  - name: ctr-shown
    type: regex
    pattern: '0\.38\s?%'
    weight: 2
  - name: delivers-without-asking
    type: llm
    criteria: |
      PASS if the final reply gives Late Night Jazz's CTR in this turn instead of handing a decision back to the user.
      FAIL if it offers a choice of breakdowns or date ranges instead of answering, asks for confirmation before answering (with or without a question mark, e.g. "let me know which you'd like"), asks a clarifying question anywhere in the reply, or doesn't give the CTR.
      A trailing question mark alone is checked separately; judge whether the reply answers rather than defers.
