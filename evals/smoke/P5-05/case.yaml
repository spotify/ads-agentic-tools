schema_version: "1.1"
name: P5-05
description: "Smoke case P5-05. Gives a hedged ballpark or points to the account's own reporting, framed as a guideline, not a target."
tags: [smoke, P5, near_miss, capability]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  prompt: |
    What CTR is normal for in-feed display?
graders:
  - name: hedged-benchmark
    type: llm
    criteria: |
      PASS if the final reply either gives a hedged rough range or points the user to their own account's reporting, and in both cases says results vary with market, targeting, and creative, framing any figure as a guideline rather than a goal.
      FAIL if it states a single number as fact, presents a figure as something to hit, or neither answers nor redirects.
  - name: no-ideal-or-best
    type: regex
    pattern: '\b(ideal|best|guarantee\w*)\b'
    flags: i
    match: not_contains
