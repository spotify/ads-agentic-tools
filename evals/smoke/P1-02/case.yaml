schema_version: "1.1"
name: P1-02
description: "Smoke case P1-02. Renames and confirms in one line. No confirmation prompt."
tags: [smoke, P1, lookup_easy_edit, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Rename Weekend Commuters to Friday Drive.
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-new-name
    type: regex
    pattern: 'Friday Drive'
  - name: no-banned-words
    type: regex
    pattern: '\b(entity|entities|staged|staging|publish\w*|please|just|simply)\b'
    flags: i
    match: not_contains
  - name: rename-sent
    type: regex
    pattern: '^PATCH__\S*ad_sets__\{id\} .*Friday Drive'
    target: { source: file, path: .claude/.api-requests.log }
    flags: m
    weight: 3
