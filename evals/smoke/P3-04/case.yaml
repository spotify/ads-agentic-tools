schema_version: "1.1"
name: P3-04
description: "Smoke case P3-04. Should ask: one short question naming Summer Tour and Winter Tour. No budget change."
tags: [smoke, P3, high_stakes_ask, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    Double the tour campaign budget.
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-both-campaigns
    type: regex
    pattern: '^(?=[\s\S]*Summer Tour)(?=[\s\S]*Winter Tour)'
  - name: no-banned-words
    type: regex
    pattern: '\b(entity|entities|publish\w*|flight|please|just|simply)\b|!'
    flags: i
    match: not_contains
