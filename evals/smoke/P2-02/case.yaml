schema_version: "1.1"
name: P2-02
description: "Smoke case P2-02. Turn 1 (history) asked about Summer Tour. Resolves 'its' to Summer Tour and asks once to confirm pausing the second ad set, naming it. Sends no pause yet."
tags: [smoke, P2, resolve_from_context, regression]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  env:
    EVAL_ADS_API_FIXTURES: .git/ads-cache
  prompt: |
    /spotify-ads-api:bulk Pause its second ad set.
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
graders:
  - name: first-untouched
    type: regex
    pattern: '^(PATCH|POST)__\S* \S*20200010-0000-4000-8000-202000000010'
    target: { source: file, path: .claude/.api-requests.log }
    flags: m
    match: not_contains
  - name: names-it
    type: regex
    pattern: 'Summer Tour - Weekend'
  - name: no-pause-yet
    type: regex
    pattern: '^(PATCH|POST)__\S* \S*20200011-0000-4000-8000-202000000011'
    target: { source: file, path: .claude/.api-requests.log }
    flags: m
    match: not_contains
    weight: 3
  - name: confirms-pause
    type: llm
    criteria: |
      "Its" refers to Summer Tour, whose second ad set is Summer Tour - Weekend. Pausing needs one confirmation first.
      PASS if the reply names Summer Tour - Weekend, says pausing stops its delivery (and may say it can be resumed), and asks once whether to pause it.
      FAIL if it says the ad set was paused, picks a different ad set, asks which ad set "its" means, or asks more than one question.
