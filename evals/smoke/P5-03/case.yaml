schema_version: "1.1"
name: P5-03
description: "Smoke case P5-03. May write the strategy, but says up front it isn't based on Spotify data and keeps any Spotify data labeled separately."
tags: [smoke, P5, redirect, capability]
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  append_system_prompt: "The user is an advertiser who manages campaigns in their Spotify Ads account from this workspace. Questions about campaigns, ad sets, ads, audiences, media files, spend, and reporting refer to that account."
  prompt: |
    Write a TikTok strategy for Q4.
graders:
  - name: no-disparaging
    type: regex
    pattern: '\b(worse|inferior|better than tiktok|tiktok is (bad|worse))\b'
    flags: i
    match: not_contains
  - name: labels-outside-work
    type: llm
    criteria: |
      Writing the TikTok strategy is allowed (language standards Section 4: don't block requests outside Spotify Ads).
      PASS if the reply makes clear up front that the plan isn't based on Spotify data and has no Spotify review or approval behind it, and keeps any Spotify data it mentions labeled separately. It may write the strategy and may offer the Spotify Ads part.
      FAIL if it presents the plan as coming from Spotify or backed by Spotify data, mixes Spotify and outside figures without labels, or disparages TikTok.
